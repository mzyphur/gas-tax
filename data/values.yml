# ---------------------------------------------------------------------
# What A$17 bn buys — Chart 4, §5
# Primary-source costings; the mental-health line is order-of-magnitude
# only (the report makes the caveat explicit).
# ---------------------------------------------------------------------
seventeen_bn_reforms_aud_bn:
  # Better Access (A$1.5 bn/yr) is UNVERIFIED — order-of-magnitude only,
  # needs PBO costing. Per v2.4.0 / C.3 it now lives in
  # `charts/04_what_17b_buys.py` with an inline `# UNVERIFIED` comment.
  # The manifest contract is "single source of truth for VERIFIED
  # canonical numbers"; chart-local indicative estimates do not belong here.
  pc_universal_childcare:        4.7   # Productivity Commission Sep 2024
  universal_dental_long_run:     7.8   # PBO ECR547 2022 (Greens costing)
  universal_dental_transition:  11.5   # PBO 2025 update, faster rollout
  bulk_billing_90pct:            1.7   # BP1 2025-26 Statement 3
  buffer_hospital_indigenous:    1.3   # = 17.0 - (4.7 + 7.8 + 1.7 + 1.5)

# ---------------------------------------------------------------------
# AEP A$21.9 bn decomposition — Chart 8, §4.5
# Australian Energy Producers media release 27 July 2025
# `precise` block is to-the-third-decimal as the chart needs; the
# rounded headline figures in the body match these to 2 sig figs.
# ---------------------------------------------------------------------
aep_2024_25_aud_bn:
  # Rounded headline figures (used by Chart 8 + body prose).
  # Precise figures (3-decimal) preserved underneath for the Appendix A
  # reconciliation table and for any future drilldown chart. The two
  # blocks must reconcile within rounding to 2 sig figs — the
  # `total` (21.95) is the sum of the four `precise` lines to that
  # precision (13.484 + 6.620 + 1.347 + 0.492 = 21.943, which rounds
  # to 21.94; quoted as 21.95 because AEP's own press release rounds
  # the headline to 21.9). v2.4.0 / C.10: this comment block was added
  # to document the precision-vs-rounded relationship explicitly.
  company_income_tax:  13.5
  royalties_excise:     6.6
  prrt:                 1.35
  all_other:            0.5
  total:               21.94    # = 13.5 + 6.6 + 1.35 + 0.5 (rounded sum)
  total_aep_headline:  21.9     # AEP press-release rounded value (1 dp)
  precise:
    company_income_tax: 13.484
    royalties_excise:    6.620
    prrt:                1.347
    all_other:           0.492
    total:              21.943  # = 13.484 + 6.620 + 1.347 + 0.492

